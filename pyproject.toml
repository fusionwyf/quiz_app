[project]
name = "quiz-app-uv"
version = "0.1.0"
description = "一个功能完整的在线答题系统后端API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docx2txt>=0.9",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.31",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]
llm = [
    "llama-cpp-python>=0.3",
]
