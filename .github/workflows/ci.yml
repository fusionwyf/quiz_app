name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: 后端 pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: uv sync

      - name: 运行测试
        run: uv run pytest -q

  frontend:
    name: 前端 tsc + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与构建
        run: npm run build
